# Shared by the prod and staging projects. deploy.sh selects the project,
# environment file, public origin, local port and memory limits.

x-logging: &logging
  driver: journald

x-app-environment: &app-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-0}
    # terse: a rejected write is logged without DETAIL, which may hold the whole
    # row with a person's name, phone and email
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}
    # No published ports: only the containers of this project reach the database
    volumes:
      # postgres:18+ keeps its data under /var/lib/postgresql (not /var/lib/postgresql/data)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -h localhost: checks TCP, so the check stays red until first-run initialization is over
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  # One-off container from the app image: applies migrations and exits.
  # `up` does not start it (profile), deploy.sh runs it before the new app.
  migrate:
    image: ghcr.io/kropush/personal-crm:${APP_TAG:?APP_TAG is not set}
    command: ["node", "migrate.cjs"]
    profiles: [tools]
    mem_limit: ${MIGRATION_MEMORY_LIMIT:-0}
    environment:
      <<: *app-environment
      CRM_OWNER_EMAIL: ${CRM_OWNER_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  app:
    image: ghcr.io/kropush/personal-crm:${APP_TAG:?APP_TAG is not set}
    restart: unless-stopped
    mem_limit: ${APP_MEMORY_LIMIT:-0}
    environment:
      <<: *app-environment
      CRM_APP_URL: ${APP_ORIGIN:-https://app.kropcrm.ru}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      CRM_MAIL_TRANSPORT: resend
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      # Localhost only: the app is reachable from outside through nginx
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  postgres-data:
