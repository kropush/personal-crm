log_format test_app_kropcrm_ru_no_query
    '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent $request_time upstream=$upstream_status';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name test-app.kropcrm.ru;

    ssl_certificate /etc/letsencrypt/live/test-app.kropcrm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-app.kropcrm.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/test-app.kropcrm.ru.access.log test_app_kropcrm_ru_no_query;
    error_log /var/log/nginx/test-app.kropcrm.ru.error.log crit;

    auth_basic "CRM staging";
    auth_basic_user_file /etc/nginx/test-app.kropcrm.ru.htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_buffering off;

    location = /health {
        # The deploy script checks nginx from loopback. Remote checks need the site password.
        satisfy any;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3001;
    }

    location = /login/verify {
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:3001;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
