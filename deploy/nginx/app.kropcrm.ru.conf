# nginx site of the app. Not installed by deploys: copied to the server once
# by hand (needs sudo), and again only if this file changes:
#   sudo cp /srv/personal-crm/deploy/nginx/app.kropcrm.ru.conf /etc/nginx/sites-available/
#   sudo nginx -t && sudo systemctl reload nginx
# The app container listens on 127.0.0.1:3000 (deploy/compose.yaml).

# The app's logs hold no personal data. The access log has the path without the
# query string (the contact search is /?q=<part of a name>) and no Referer (the
# previous page's address, query string included). Errors at "error" level and
# below quote both, so only critical ones are logged; a failed request still
# shows in the access log with its status and the app's. Defined here rather
# than in nginx.conf, which the server shares with the landing page.
log_format app_kropcrm_ru_no_query
    '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent $request_time upstream=$upstream_status '
    '"$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name app.kropcrm.ru;

    access_log /var/log/nginx/app.kropcrm.ru.access.log app_kropcrm_ru_no_query;
    error_log /var/log/nginx/app.kropcrm.ru.error.log crit;

    # Certificate renewal (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.kropcrm.ru;

    access_log /var/log/nginx/app.kropcrm.ru.access.log app_kropcrm_ru_no_query;
    error_log /var/log/nginx/app.kropcrm.ru.error.log crit;

    include snippets/kropcrm-ssl.conf;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Pages arrive in parts (React Suspense streaming): pass each part on at once
    proxy_buffering off;

    location = /login/verify {
        # nginx error messages can include the full URL, including the sign-in token.
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
