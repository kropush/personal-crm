# nginx site of the app. Not installed by deploys: copied to the server once
# by hand (needs sudo), and again only if this file changes:
#   sudo cp /srv/personal-crm/deploy/nginx/app.kropcrm.ru.conf /etc/nginx/sites-available/
#   sudo nginx -t && sudo systemctl reload nginx
# The app container listens on 127.0.0.1:3000 (deploy/compose.yaml).

server {
    listen 80;
    listen [::]:80;
    server_name app.kropcrm.ru;

    # Certificate renewal (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.kropcrm.ru;

    include snippets/kropcrm-ssl.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pages arrive in parts (React Suspense streaming): pass each part on at once
        proxy_buffering off;
    }
}
