server {
    listen 80;
    listen [::]:80;
    server_name test-app.kropcrm.ru;

    access_log off;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://test-app.kropcrm.ru$request_uri;
    }
}
