# Push to main -> image tagged with the commit SHA -> GHCR -> the server.
# What happens on the server is in deploy/deploy.sh.

name: Deploy

on:
  push:
    branches: [main]

# One deploy at a time, and a running deploy is never cancelled halfway
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: deploy/ci-deploy.sh
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
